name: Context Core CI

on:
  push:
    branches: [main]
    paths:
      - 'ada-context-core/**'
      - '.github/workflows/context-core-ci.yml'
  pull_request:
    paths:
      - 'ada-context-core/**'
      - '.github/workflows/context-core-ci.yml'

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            ada-context-core/app/requirements.txt
            ada-context-core/mcp/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ada-context-core/app/requirements.txt
          pip install -r ada-context-core/mcp/requirements.txt
          pip install pytest
      - name: Compile
        working-directory: ada-context-core
        run: python -m compileall app mcp
      - name: Run pure contract tests
        working-directory: ada-context-core
        run: pytest -q
